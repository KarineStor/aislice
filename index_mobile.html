<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Slice — Daily report · Nordwell Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --tol-navy-900:#070452;--tol-navy-800:#0C0968;--tol-navy-700:#1B1790;
  --tol-blue-600:#1C16C5;--tol-blue-500:#2E27E0;
  --tol-cyan-500:#00C8FF;--tol-cyan-400:#3FD6FF;
  --tol-ice-200:#ADFFFE;--tol-ice-100:#EBFFFF;--tol-ice-050:#F6FFFF;
  --tol-coral:#FF4A6E;--tol-sun:#FFC83D;
  --tol-ink-900:#070452;--tol-ink-700:#312E7A;--tol-ink-500:#6B69A8;
  --tol-line-200:#D9DAF2;--tol-line-100:#EAEBF7;
  --fg1:var(--tol-ink-900);--fg2:var(--tol-ink-700);--fg3:var(--tol-ink-500);
  --font-brand:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-ui:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --px:16px;
}
@media(min-width:600px){:root{--px:28px;}}
@media(min-width:1025px){:root{--px:48px;}}

*{box-sizing:border-box;}
html,body{margin:0;background:var(--tol-ice-050);color:var(--fg1);font-family:var(--font-ui);min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{min-height:100vh;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{background:var(--tol-navy-900);color:#fff;padding:0 var(--px);height:52px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:50;}
.topbar-wm{display:flex;align-items:baseline;gap:2px;font-family:var(--font-brand);font-weight:800;font-size:16px;letter-spacing:-0.02em;white-space:nowrap;}
.topbar-wm .br{color:var(--tol-cyan-500);}
.topbar-div{width:1px;height:18px;background:rgba(255,255,255,0.14);flex-shrink:0;}
.topbar-op{font-size:12px;color:rgba(255,255,255,0.72);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-op strong{color:#fff;font-weight:600;}
.topbar-spacer{flex:1;min-width:0;}
.topbar-nav{display:flex;gap:18px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.72);}
.topbar-nav a{color:inherit;cursor:pointer;padding:5px 0;border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap;}
.topbar-nav a.active{color:#fff;border-bottom-color:var(--tol-cyan-500);}
.topbar-status{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.7);padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);white-space:nowrap;}
.topbar-status .dot{width:6px;height:6px;border-radius:50%;background:#00D68F;box-shadow:0 0 0 3px rgba(0,214,143,0.18);flex-shrink:0;}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--tol-cyan-500),var(--tol-blue-500));display:flex;align-items:center;justify-content:center;color:var(--tol-navy-900);font-weight:700;font-size:10px;flex-shrink:0;}
.topbar-uname{font-size:12px;font-weight:500;white-space:nowrap;}
@media(max-width:767px){.topbar-nav,.topbar-uname,.topbar-status{display:none;}.topbar-div.d2{display:none;}}
@media(min-width:768px)and(max-width:1100px){.topbar-nav{gap:12px;}}

/* PAGE HEAD */
.page-head{padding:20px var(--px) 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.page-head .title-row{display:flex;flex-direction:column;gap:5px;min-width:0;}
.page-head .eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.16em;color:var(--tol-blue-600);}
.page-head h1{font-family:var(--font-brand);font-size:clamp(28px,5vw,52px);font-weight:800;letter-spacing:-0.025em;line-height:1.04;margin:0;color:var(--tol-navy-900);}
.page-head h1 .bracket{color:var(--tol-cyan-500);font-style:normal;}
.page-head h1 .bracket::before{content:"[";}
.page-head h1 .bracket::after{content:"]";}
.page-head .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--fg3);margin-top:2px;}
.page-head .meta strong{color:var(--fg1);font-weight:600;}
.page-head .meta .sep{color:var(--tol-line-200);}
.controls{display:flex;gap:8px;align-items:center;flex-shrink:0;}
@media(max-width:499px){.page-head{flex-direction:column;}.page-head .meta .sep{display:none;}.controls{width:100%;}.seg{flex:1;}.seg button{flex:1;}}

/* BUTTONS */
.btn{font-family:var(--font-ui);font-size:12px;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--tol-line-200);background:#fff;color:var(--tol-navy-900);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background 140ms,border-color 140ms,transform 80ms;white-space:nowrap;}
.btn:hover{background:var(--tol-ice-100);border-color:var(--tol-cyan-500);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--tol-blue-600);color:#fff;border-color:var(--tol-blue-600);}
.btn-primary:hover{background:var(--tol-blue-500);border-color:var(--tol-blue-500);}
.btn-text{display:none;}
@media(min-width:600px){.btn-text{display:inline;}}
.seg{display:inline-flex;padding:3px;background:#fff;border:1px solid var(--tol-line-200);border-radius:9px;gap:2px;}
.seg button{border:none;background:transparent;font-family:var(--font-ui);font-size:11px;font-weight:600;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--fg2);}
.seg button.on{background:var(--tol-navy-900);color:#fff;}

/* PAGE BODY */
.page-body{padding:0 var(--px) 56px;display:flex;flex-direction:column;gap:14px;}
@media(min-width:768px){.page-body{gap:18px;}}
@media(min-width:1025px){.page-body{gap:22px;}}

.grid-8-4{display:grid;gap:14px;grid-template-columns:1fr;}
@media(min-width:860px){.grid-8-4{grid-template-columns:2fr 1fr;gap:18px;}}
@media(min-width:1025px){.grid-8-4{gap:22px;}}
.grid-2col{display:grid;gap:14px;grid-template-columns:1fr;}
@media(min-width:768px){.grid-2col{grid-template-columns:1fr 1fr;gap:18px;}}
@media(min-width:1025px){.grid-2col{gap:22px;}}

/* CARD */
.card{background:#fff;border:1px solid var(--tol-line-200);border-radius:14px;padding:18px;width:100%;display:flex;flex-direction:column;transition:border-color 140ms,box-shadow 140ms;}
@media(min-width:768px){.card{padding:22px;}}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px;}
.card-head .lbl{display:flex;flex-direction:column;gap:3px;}
.card-head .eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;color:var(--tol-cyan-500);}
.card-head h3{margin:0;font-family:var(--font-brand);font-size:16px;font-weight:700;letter-spacing:-0.01em;color:var(--tol-navy-900);}
@media(min-width:768px){.card-head h3{font-size:19px;}}
.card-head .head-action{font-size:11px;font-weight:600;color:var(--tol-blue-600);cursor:pointer;padding:3px 0;border-bottom:1px solid currentColor;white-space:nowrap;flex-shrink:0;}
.card-head .head-action:hover{opacity:0.7;}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:1fr 1fr;background:var(--tol-navy-900);color:#fff;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 10px 36px rgba(7,4,82,0.18);}
@media(min-width:860px){.kpi-strip{grid-template-columns:repeat(4,1fr);border-radius:16px;}}
.kpi-strip::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 15% 20%,rgba(0,200,255,0.10),transparent 60%);pointer-events:none;}
.kpi{padding:18px 16px;border-right:1px solid rgba(255,255,255,0.08);position:relative;cursor:pointer;transition:background 140ms;}
@media(min-width:600px){.kpi{padding:22px 20px;}}
@media(min-width:860px){.kpi{padding:26px 24px;}}
/* 2-col borders */
.kpi:nth-child(2n){border-right:none;}
.kpi:nth-child(1),.kpi:nth-child(2){border-bottom:1px solid rgba(255,255,255,0.08);}
@media(min-width:860px){
  .kpi{border-right:1px solid rgba(255,255,255,0.08);border-bottom:none;}
  .kpi:nth-child(2n){border-right:1px solid rgba(255,255,255,0.08);}
  .kpi:last-child{border-right:none;}
  .kpi:nth-child(1),.kpi:nth-child(2){border-bottom:none;}
}
.kpi:hover{background:rgba(0,200,255,0.06);}
.kpi .kpi-eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;color:var(--tol-cyan-500);display:flex;align-items:center;gap:7px;}
.kpi .kpi-eyebrow .sparkline{height:11px;opacity:0.8;}
.kpi .kpi-value{font-family:var(--font-brand);font-size:clamp(32px,4.5vw,60px);font-weight:800;letter-spacing:-0.035em;line-height:1.02;margin:10px 0 6px;color:#fff;display:flex;align-items:baseline;gap:2px;}
.kpi .kpi-value .unit{font-size:clamp(15px,2.2vw,26px);font-weight:700;color:var(--tol-cyan-500);margin-left:2px;}
.kpi .kpi-sub{font-size:11px;color:rgba(255,255,255,0.60);font-weight:500;}
.kpi .kpi-delta{margin-top:10px;font-size:10px;font-weight:600;font-family:var(--font-mono);display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,0.16);color:#fff;}
.kpi .kpi-delta.up{color:#6EFFC1;border-color:rgba(110,255,193,0.30);}
.kpi .kpi-delta.dn{color:var(--tol-coral);border-color:rgba(255,74,110,0.30);}
.kpi .kpi-delta.flat{color:rgba(255,255,255,0.62);}
.kpi .kpi-cta{position:absolute;right:14px;top:14px;font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--tol-cyan-500);opacity:0;transition:opacity 140ms;}
.kpi:hover .kpi-cta{opacity:1;}

/* NUM */
.num{font-family:var(--font-brand);font-weight:800;color:inherit;cursor:pointer;position:relative;padding:0 2px;border-radius:4px;transition:background 140ms,color 140ms;display:inline-block;}
.num::after{content:"";position:absolute;left:2px;right:2px;bottom:-2px;height:1px;background:currentColor;opacity:0.32;transition:opacity 140ms,background 140ms;}
.num:hover{background:rgba(0,200,255,0.14);color:var(--tol-blue-600);}
.num:hover::after{opacity:1;background:var(--tol-cyan-500);}

/* TIER LIST */
.tier-table-head{display:none;padding:0 8px 8px;border-bottom:1px solid var(--tol-line-200);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.10em;color:var(--fg3);margin-bottom:4px;}
@media(min-width:768px){
  .tier-table-head{display:grid;grid-template-columns:minmax(130px,2fr) minmax(100px,1.2fr) minmax(70px,0.8fr) minmax(88px,1fr) minmax(78px,0.9fr) 16px;gap:10px;}
}
.tier-list{display:flex;flex-direction:column;gap:0;flex:1;}

/* Mobile tier row */
.tier-row{display:flex;flex-direction:column;gap:8px;padding:12px 8px;border-radius:8px;cursor:pointer;transition:background 120ms;border-bottom:1px solid var(--tol-line-100);}
.tier-row:last-child{border-bottom:none;}
.tier-row:hover{background:var(--tol-ice-050);}
.tr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.tr-metrics{display:flex;gap:14px;padding-left:2px;}
.tm{display:flex;flex-direction:column;gap:1px;}
.tm .ml{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.10em;color:var(--fg3);}
.tm .mv{font-family:var(--font-mono);font-size:12px;color:var(--tol-navy-900);white-space:nowrap;font-variant-numeric:tabular-nums;}
/* Desktop tier row */
@media(min-width:768px){
  .tier-row{display:grid;grid-template-columns:minmax(130px,2fr) minmax(100px,1.2fr) minmax(70px,0.8fr) minmax(88px,1fr) minmax(78px,0.9fr) 16px;gap:10px;align-items:center;padding:14px 8px;flex-direction:unset;border-bottom:none;}
  .tier-row+.tier-row{border-top:1px solid var(--tol-line-100);}
  .tr-top{display:contents;}
  .tr-metrics{display:contents;}
  .tm{display:contents;}
  .tm .ml{display:none;}
  .tm .mv{font-size:13px;}
}
.tier-name{display:flex;flex-direction:column;gap:2px;min-width:0;}
.tier-name .tn{font-weight:700;font-size:13px;color:var(--tol-navy-900);line-height:1.25;}
@media(min-width:768px){.tier-name .tn{font-size:14px;}}
.tier-name .tw{font-size:11px;color:var(--fg3);line-height:1.3;}
.tier-bar{display:flex;flex-direction:column;gap:4px;min-width:0;}
.bar-track{height:5px;background:var(--tol-line-100);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--tol-blue-600),var(--tol-cyan-500));border-radius:999px;}
.tier-bar .pct{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
.tier-metric{font-family:var(--font-mono);font-size:13px;color:var(--tol-navy-900);white-space:nowrap;font-variant-numeric:tabular-nums;}
.chev{text-align:right;color:var(--fg3);font-size:15px;opacity:0.4;transition:opacity 120ms,color 120ms,transform 120ms;}
.tier-row:hover .chev{opacity:1;color:var(--tol-blue-600);transform:translateX(2px);}

/* OPS */
.ops-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--tol-line-100);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.ops-summary>div{background:#fff;padding:11px 10px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background 120ms;}
.ops-summary>div:hover{background:var(--tol-ice-050);}
.ops-summary .lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--fg3);}
.ops-summary .val{font-family:var(--font-brand);font-weight:800;font-size:22px;letter-spacing:-0.02em;color:var(--tol-navy-900);}
@media(min-width:768px){.ops-summary .val{font-size:26px;}}
.ops-list{display:flex;flex-direction:column;gap:5px;flex:1;}
.ops-item{padding:10px 11px;border:1px solid var(--tol-line-100);border-radius:9px;cursor:pointer;transition:border-color 120ms,background 120ms;}
.ops-item:hover{border-color:rgba(0,200,255,0.40);background:var(--tol-ice-050);}
.ops-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;}
.ops-name{font-weight:600;font-size:12px;color:var(--tol-navy-900);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;}
.ops-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ops-id{font-family:var(--font-mono);font-size:9px;color:var(--fg3);flex-shrink:0;}
.ops-asset{font-size:11px;color:var(--fg3);font-weight:500;}
.ops-eta{font-family:var(--font-mono);font-size:10px;color:var(--fg3);}
.ops-bar{height:3px;background:var(--tol-line-100);border-radius:999px;overflow:hidden;margin-top:6px;}
.ops-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--tol-cyan-500),var(--tol-blue-500));border-radius:999px;}

/* STATE PILLS */
.state-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.10em;flex-shrink:0;}
.state-pill .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.state-pill.running{background:rgba(0,214,143,0.12);color:#06754F;}
.state-pill.running .dot{background:#00D68F;box-shadow:0 0 0 2px rgba(0,214,143,0.30);animation:pulse 1.6s infinite;}
.state-pill.queued{background:var(--tol-line-100);color:var(--fg2);}
.state-pill.queued .dot{background:var(--fg3);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(0,214,143,0.30);}50%{box-shadow:0 0 0 5px rgba(0,214,143,0.05);}}

/* CYBER */
.cyber-stat-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.cyber-big{display:flex;flex-direction:column;gap:3px;}
.cyber-big .v{font-family:var(--font-brand);font-weight:800;font-size:clamp(36px,5.5vw,60px);letter-spacing:-0.035em;line-height:1;color:var(--tol-navy-900);}
.cyber-big .l{font-size:11px;color:var(--fg3);font-weight:500;}
.cyber-side{display:flex;flex-direction:column;gap:2px;}
.cyber-side .v{font-family:var(--font-brand);font-weight:800;font-size:clamp(18px,2.8vw,26px);letter-spacing:-0.02em;color:var(--tol-navy-900);}
.cyber-side .l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--fg3);}
.spark-row{display:flex;align-items:flex-end;gap:2px;height:44px;margin-bottom:8px;}
@media(min-width:600px){.spark-row{height:52px;gap:3px;}}
.spark-row .bar{flex:1;background:linear-gradient(180deg,var(--tol-cyan-500),var(--tol-blue-600));border-radius:2px;min-height:3px;cursor:pointer;opacity:0.85;transition:opacity 120ms,transform 120ms;position:relative;}
.spark-row .bar:hover{opacity:1;transform:scaleY(1.05);transform-origin:bottom;}
.spark-row .bar .tip{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--tol-navy-900);color:#fff;padding:3px 7px;border-radius:5px;font-size:10px;font-family:var(--font-mono);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms;z-index:10;}
.spark-row .bar:hover .tip{opacity:1;}
.spark-axis{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--fg3);margin-bottom:10px;}
.vector-list{display:flex;flex-direction:column;}
.vector-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--tol-line-100);cursor:pointer;}
.vector-row:first-child{border-top:none;}
.vector-row:hover .vname{color:var(--tol-blue-600);}
.vname{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--tol-navy-900);}
.sev-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.sev-dot.high{background:var(--tol-coral);box-shadow:0 0 0 2px rgba(255,74,110,0.18);}
.sev-dot.medium{background:var(--tol-sun);box-shadow:0 0 0 2px rgba(255,200,61,0.18);}
.sev-dot.low{background:var(--tol-cyan-500);box-shadow:0 0 0 2px rgba(0,200,255,0.18);}

/* SLA */
.sla-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
@media(max-width:360px){.sla-summary{grid-template-columns:repeat(2,1fr);}}
.sla-pill{padding:9px 10px;border-radius:9px;background:var(--tol-ice-050);border:1px solid var(--tol-line-100);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:border-color 120ms;}
.sla-pill:hover{border-color:var(--tol-cyan-500);}
.sla-pill .v{font-family:var(--font-brand);font-weight:800;font-size:19px;letter-spacing:-0.02em;color:var(--tol-navy-900);}
@media(min-width:768px){.sla-pill .v{font-size:22px;}}
.sla-pill .l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.10em;color:var(--fg3);}
.sla-pill.breach{background:rgba(255,74,110,0.08);border-color:rgba(255,74,110,0.20);}
.sla-pill.breach .v{color:#B7314B;}
.sla-pill.degraded{background:rgba(255,200,61,0.10);border-color:rgba(255,200,61,0.25);}
.sla-pill.warning{background:rgba(0,200,255,0.08);border-color:rgba(0,200,255,0.25);}
.sla-table-head{display:none;}
@media(min-width:860px){
  .sla-table-head{display:grid;grid-template-columns:10px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 16px;gap:10px;padding:0 4px 8px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--fg3);}
}
.sla-list{display:flex;flex-direction:column;}
/* Mobile SLA row */
.sla-row{display:flex;flex-direction:column;gap:4px;padding:9px 4px;border-top:1px solid var(--tol-line-100);cursor:pointer;transition:background 120ms;position:relative;padding-right:20px;}
.sla-row:first-of-type{border-top:1px solid var(--tol-line-200);}
.sla-row:hover{background:var(--tol-ice-050);}
.sr-top{display:flex;align-items:flex-start;gap:7px;}

<script type="text/babel">
const {useState,useEffect}=React;

function Num({value,onClick}){return <span className="num" role="button" tabIndex={0} onClick={e=>{e.stopPropagation();onClick&&onClick();}} onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onClick&&onClick();}}}>{value}</span>;}
function Spark({points,w=52,h=11,stroke="#00C8FF"}){const mx=Math.max(...points),mn=Math.min(...points),rng=mx-mn||1,st=w/(points.length-1);const d=points.map((p,i)=>`${i===0?"M":"L"} ${(i*st).toFixed(1)} ${(h-((p-mn)/rng)*h).toFixed(1)}`).join(" ");return <svg className="sparkline" viewBox={`0 0 ${w} ${h}`} width={w} height={h} fill="none"><path d={d} stroke={stroke} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;}
function Pill({state}){return <span className={`state-pill ${state}`}><span className="dot"/>{state}</span>;}

function TopBar(){return(
  <div className="topbar">
    <div className="topbar-wm"><span>Telenor's</span><span className="br">&nbsp;[AI]&nbsp;</span><span>Slice</span></div>

    <div className="topbar-status"><span className="dot"/><span>Synced {window.appData.syncedAt}</span></div>
    <div className="topbar-div d2"/>

    <span className="topbar-uname">Ingrid Halvorsen</span>

);}

  if(sub==="critical"){title="# Critical threats";value=c.critical;}
  if(sub==="isolated"){title="# Slices auto-isolated";value=c.isolated;}
  if(sub.startsWith("vector:")){const name=sub.slice(7);const v=c.vectors.find(x=>x.name===name);title="# "+name;value=v?v.count:"—";}
  if(sub.startsWith("hour:")){const hr=parseInt(sub.slice(5),10);title="# Events · "+String(hr).padStart(2,"0")+":00";value=c.hourly[hr];}
  return(<>
  <DH eyebrow="Security · AI Slice firewall" title={title+" · "+value} sub="All blocks happened before traffic reached customer infrastructure." onClose={onClose}/>
  <div className="drawer-body">
    <div className="drawer-section"><h4>Top vectors today</h4>
      <div className="bd-legend">{c.vectors.map(v=><div key={v.name} className="lg"><span className="sw" style={{background:v.severity==="high"?"#FF4A6E":v.severity==="medium"?"#FFC83D":"#00C8FF"}}/><span className="n">{v.name}</span><span className="c"></span><span className="p">{v.count}</span></div>)}</div>
    </div>
    <div className="drawer-section"><h4>Most recent · 4 of {c.prevented}</h4>
      <div className="timeline">{c.recent.map((r,i)=>(
        <div key={i} className="tl-row"><span className="time">{r.time}</span><div className="body"><strong>{r.vector}</strong><div className="meta">{r.asset} · {r.action}</div></div><span className={`sev-dot ${r.severity==="high"?"high":r.severity==="medium"?"medium":"low"}`}/></div>
      ))}</div>
    </div>
    <div className="callout">AI Slice slices are <strong>cryptographically isolated</strong> per workload — a compromise on one slice cannot lateral-move into others.</div>
  </div>
</>);}

function DrawerContent({drawerKey,onClose}){const [base,...rest]=drawerKey.split(":");const sub=rest.join(":");
  if(base==="compute")    return <ComputeDrawer onClose={onClose}/>;
  if(base==="cost")       return <CostDrawer onClose={onClose}/>;
  if(base==="emissions")  return <EmissionsDrawer onClose={onClose}/>;
  if(base==="sla")        return <SlaDrawer onClose={onClose} sub={sub}/>;
  if(base==="slaitem")    return <SlaItemDrawer onClose={onClose} id={sub}/>;
  if(base==="tier")       return <TierDrawer onClose={onClose} id={sub}/>;
  if(base==="autonomous") return <AutonomousDrawer onClose={onClose} sub={sub}/>;
  if(base==="op")         return <OpDrawer onClose={onClose} id={sub}/>;
  if(base==="cyber")      return <CyberDrawer onClose={onClose} sub={sub}/>;
  return <DH eyebrow="Detail" title="Not implemented" sub={drawerKey} onClose={onClose}/>;
}

function Drawer({drawerKey,onClose}){const open=drawerKey!==null;
  useEffect(()=>{const f=e=>{if(e.key==="Escape"&&open)onClose();};window.addEventListener("keydown",f);return()=>window.removeEventListener("keydown",f);},[open,onClose]);
  useEffect(()=>{document.body.style.overflow=open?"hidden":"";return()=>{document.body.style.overflow="";};},[open]);
  return(<><div className={`drawer-scrim ${open?"open":""}`} onClick={onClose}/><aside className={`drawer ${open?"open":""}`} role="dialog" aria-hidden={!open}>{open&&<DrawerContent drawerKey={drawerKey} onClose={onClose}/>}</aside></>);
}

function TweaksPanel({shell,onShell,kpiAccent,onAccent,showSpark,onSpark,denseTier,onDense}){
  const [open,setOpen]=useState(false);
  const A=[{key:"cyan",hex:"#00C8FF"},{key:"ice",hex:"#ADFFFE"},{key:"coral",hex:"#FF4A6E"},{key:"sun",hex:"#FFC83D"}];
  return(<>
    {!open&&<button className="twk-fab" onClick={()=>setOpen(true)}>⚙ Tweaks</button>}
    {open&&<div className="twk-panel">
      <div className="twk-hd"><b>Tweaks</b><button className="twk-x" onClick={()=>setOpen(false)}>✕</button></div>
      <div className="twk-body">
        <div className="twk-sect">Shell</div>
        <div className="twk-row"><div className="twk-lbl"><span>Theme</span></div>
          <div className="twk-seg"><div className="twk-seg-thumb" style={{left:shell==="light"?"2px":"calc(50% + 1px)",width:"calc(50% - 3px)"}}/>
            {["light","dark"].map(v=><button key={v} onClick={()=>onShell(v)}>{v}</button>)}
          </div>
        </div>
        <div className="twk-sect">Visuals</div>
        <div className="twk-row"><div className="twk-lbl"><span>Accent</span></div>
          <div className="twk-chips">{A.map(a=><button key={a.key} className="twk-chip" data-on={kpiAccent===a.key?"1":"0"} style={{background:a.hex}} onClick={()=>onAccent(a.key)}/>)}</div>
        </div>
        <div className="twk-row twk-row-h"><div className="twk-lbl"><span>KPI sparklines</span></div><button className="twk-toggle" data-on={showSpark?"1":"0"} onClick={()=>onSpark(!showSpark)}><i/></button></div>
        <div className="twk-row twk-row-h"><div className="twk-lbl"><span>Dense tier table</span></div><button className="twk-toggle" data-on={denseTier?"1":"0"} onClick={()=>onDense(!denseTier)}><i/></button></div>
      </div>
    </div>}
  </>);
}

function App(){
  const [drawerKey,setDrawerKey]=useState(null);
  const [period,setPeriod]=useState("Today");
  const [shell,setShell]=useState("light");
  const [kpiAccent,setKpiAccent]=useState("cyan");
  const [showSpark,setShowSpark]=useState(true);
  const [denseTier,setDenseTier]=useState(false);
  const ACCENTS={cyan:"#00C8FF",ice:"#ADFFFE",coral:"#FF4A6E",sun:"#FFC83D"};
  useEffect(()=>{document.body.classList.toggle("dark-shell",shell==="dark");},[shell]);
  useEffect(()=>{document.documentElement.style.setProperty("--accent-live",ACCENTS[kpiAccent]||"#00C8FF");},[kpiAccent]);
  useEffect(()=>{document.querySelectorAll(".kpi .sparkline").forEach(el=>{el.style.display=showSpark?"":"none";});},[showSpark]);
  useEffect(()=>{document.querySelectorAll(".tier-row").forEach(el=>{el.style.padding=denseTier?"7px 8px":"";});},[denseTier]);
  return(
    <div className="app">
      <TopBar/>
      <PageHead period={period} setPeriod={setPeriod}/>
      <div className="page-body">
        <KpiStrip openDrawer={setDrawerKey}/>
        <div className="grid-8-4"><ComputeBreakdown openDrawer={setDrawerKey}/><AutonomousOps openDrawer={setDrawerKey}/></div>
        <div className="grid-2col"><CyberCard openDrawer={setDrawerKey}/><SlaCard openDrawer={setDrawerKey}/></div>
      </div>
      <div className="page-foot">
        <span>Telenor's <span style={{color:"var(--tol-cyan-500)"}}>[AI]</span> Slice · Daily report engine v4.18 · last sync {window.appData.syncedAt}</span>
        <div className="legal"><span>Sovereignty: Norway / EEA</span><span>·</span><span>SOC 2 Type II</span><span>·</span><span>ISO 27001</span></div>
      </div>
      <Drawer drawerKey={drawerKey} onClose={()=>setDrawerKey(null)}/>
      <TweaksPanel shell={shell} onShell={setShell} kpiAccent={kpiAccent} onAccent={setKpiAccent} showSpark={showSpark} onSpark={setShowSpark} denseTier={denseTier} onDense={setDenseTier}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
