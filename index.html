<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Slice — Daily report · Nordwell Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Telenor Open Lab Design Tokens ─────────────────────────── */
:root {
  --tol-navy-900: #070452;
  --tol-navy-800: #0C0968;
  --tol-navy-700: #1B1790;
  --tol-blue-600: #1C16C5;
  --tol-blue-500: #2E27E0;
  --tol-cyan-500: #00C8FF;
  --tol-cyan-400: #3FD6FF;
  --tol-ice-200: #ADFFFE;
  --tol-ice-100: #EBFFFF;
  --tol-ice-050: #F6FFFF;
  --tol-coral: #FF4A6E;
  --tol-sun: #FFC83D;
  --tol-white: #FFFFFF;
  --tol-ink-900: #070452;
  --tol-ink-700: #312E7A;
  --tol-ink-500: #6B69A8;
  --tol-line-200: #D9DAF2;
  --tol-line-100: #EAEBF7;
  --fg-on-light-1: var(--tol-ink-900);
  --fg-on-light-2: var(--tol-ink-700);
  --fg-on-light-3: var(--tol-ink-500);
  --success: #00D68F;
  --font-brand: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-ui:    "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease-standard: cubic-bezier(0.2, 0.0, 0.0, 1.0);
  --ease-emphasis: cubic-bezier(0.2, 0.8, 0.2, 1.0);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--tol-ice-050);
  color: var(--fg-on-light-1);
  font-family: var(--font-ui);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app { min-height: 100vh; min-width: 1280px; display: flex; flex-direction: column; }

/* ── Topbar ─────────────────────────────────────────────────── */
.topbar {
  background: var(--tol-navy-900); color: #fff;
  padding: 14px 32px; display: flex; align-items: center; gap: 28px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.topbar-wm { display: flex; align-items: baseline; gap: 2px; font-family: var(--font-brand); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.topbar-wm .br { color: var(--tol-cyan-500); }
.topbar-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.14); }
.topbar-context { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,0.72); font-weight: 500; }
.topbar-context .op { color: #fff; font-weight: 600; }
.topbar-spacer { flex: 1; }
.topbar-nav { display: flex; gap: 24px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.72); }
.topbar-nav a { color: inherit; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; text-decoration: none; }
.topbar-nav a.active { color: #fff; border-bottom-color: var(--tol-cyan-500); }
.topbar-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.72); padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); }
.topbar-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #00D68F; box-shadow: 0 0 0 3px rgba(0,214,143,0.18); }
.topbar-user { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
.topbar-user .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--tol-cyan-500), var(--tol-blue-500)); display: flex; align-items: center; justify-content: center; color: var(--tol-navy-900); font-weight: 700; font-size: 12px; }

/* ── Page head ──────────────────────────────────────────────── */
.page-head { padding: 40px 48px 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
.page-head .title-row { display: flex; flex-direction: column; gap: 8px; }
.page-head .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--tol-blue-600); }
.page-head h1 { font-family: var(--font-brand); font-size: 56px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.02; margin: 0; color: var(--tol-navy-900); }
.page-head h1 .bracket { color: var(--tol-cyan-500); font-style: normal; }
.page-head h1 .bracket::before { content: "["; }
.page-head h1 .bracket::after  { content: "]"; }
.page-head .meta { display: flex; gap: 18px; align-items: center; font-size: 14px; color: var(--fg-on-light-3); margin-top: 6px; }
.page-head .meta strong { color: var(--fg-on-light-1); font-weight: 600; }
.page-head .controls { display: flex; gap: 10px; align-items: center; }

/* ── Buttons ────────────────────────────────────────────────── */
.btn { font-family: var(--font-ui); font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--tol-line-200); background: #fff; color: var(--tol-navy-900); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 140ms, border-color 140ms, transform 80ms; }
.btn:hover { background: var(--tol-ice-100); border-color: var(--tol-cyan-500); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--tol-blue-600); color: #fff; border-color: var(--tol-blue-600); }
.btn-primary:hover { background: var(--tol-blue-500); border-color: var(--tol-blue-500); }

.seg { display: inline-flex; padding: 3px; background: #fff; border: 1px solid var(--tol-line-200); border-radius: 10px; gap: 2px; }
.seg button { border: none; background: transparent; font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 7px; cursor: pointer; color: var(--fg-on-light-2); }
.seg button.on { background: var(--tol-navy-900); color: #fff; }

/* ── Page body ──────────────────────────────────────────────── */
.page-body { padding: 0 48px 64px; display: flex; flex-direction: column; gap: 24px; }
.grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }

/* ── Card ───────────────────────────────────────────────────── */
.card { background: #fff; border: 1px solid var(--tol-line-200); border-radius: 14px; padding: 24px; position: relative; width: 100%; display: flex; flex-direction: column; transition: border-color 140ms, box-shadow 140ms; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: rgba(0,200,255,0.45); box-shadow: 0 8px 28px rgba(7,4,82,0.08); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.card-head .lbl { display: flex; flex-direction: column; gap: 4px; }
.card-head .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--tol-cyan-500); }
.card-head h3 { margin: 0; font-family: var(--font-brand); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--tol-navy-900); }
.card-head .head-action { font-size: 12px; font-weight: 600; color: var(--tol-blue-600); cursor: pointer; padding: 4px 0; border-bottom: 1px solid currentColor; white-space: nowrap; }
.card-head .head-action:hover { opacity: 0.7; }

/* ── KPI strip ──────────────────────────────────────────────── */
.kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: var(--tol-navy-900); color: #fff; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 12px 40px rgba(7,4,82,0.18); }
.kpi-strip::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 80% at 15% 20%, rgba(0,200,255,0.10), transparent 60%); pointer-events: none; }
.kpi { padding: 28px; border-right: 1px solid rgba(255,255,255,0.08); position: relative; cursor: pointer; transition: background 140ms; }
.kpi:last-child { border-right: none; }
.kpi:hover { background: rgba(0,200,255,0.06); }
.kpi .kpi-eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--tol-cyan-500); display: flex; align-items: center; gap: 8px; }
.kpi .kpi-eyebrow .sparkline { height: 14px; opacity: 0.8; }
.kpi .kpi-value { font-family: var(--font-brand); font-size: 64px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; margin: 14px 0 8px; color: #fff; display: flex; align-items: baseline; gap: 2px; }
.kpi .kpi-value .unit { font-size: 28px; font-weight: 700; color: var(--tol-cyan-500); margin-left: 2px; }
.kpi .kpi-sub { font-size: 13px; color: rgba(255,255,255,0.62); font-weight: 500; }
.kpi .kpi-delta { margin-top: 14px; font-size: 12px; font-weight: 600; font-family: var(--font-mono); display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); color: #fff; }
.kpi .kpi-delta.up   { color: #6EFFC1; border-color: rgba(110,255,193,0.30); }
.kpi .kpi-delta.dn   { color: var(--tol-coral); border-color: rgba(255,74,110,0.30); }
.kpi .kpi-delta.flat { color: rgba(255,255,255,0.62); }
.kpi .kpi-cta { position: absolute; right: 22px; top: 22px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tol-cyan-500); opacity: 0; transition: opacity 140ms; }
.kpi:hover .kpi-cta { opacity: 1; }

/* ── Num pill ───────────────────────────────────────────────── */
.num { font-family: var(--font-brand); font-weight: 800; color: inherit; cursor: pointer; position: relative; padding: 0 2px; border-radius: 4px; transition: background 140ms, color 140ms; display: inline-block; }
.num::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: -2px; height: 1px; background: currentColor; opacity: 0.32; transition: opacity 140ms, background 140ms; }
.num:hover { background: rgba(0,200,255,0.14); color: var(--tol-blue-600); }
.num:hover::after { opacity: 1; background: var(--tol-cyan-500); }

/* ── Tier list ──────────────────────────────────────────────── */
.tier-table-head { display: grid; grid-template-columns: minmax(160px,2.2fr) minmax(120px,1.4fr) minmax(80px,0.9fr) minmax(100px,1fr) minmax(90px,0.9fr) 18px; gap: 14px; padding: 0 12px 10px; border-bottom: 1px solid var(--tol-line-200); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.10em; color: var(--fg-on-light-3); margin-bottom: 6px; }
.tier-list { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.tier-row { display: grid; grid-template-columns: minmax(160px,2.2fr) minmax(120px,1.4fr) minmax(80px,0.9fr) minmax(100px,1fr) minmax(90px,0.9fr) 18px; gap: 14px; align-items: center; padding: 18px 12px; border-radius: 10px; cursor: pointer; transition: background 120ms; }
.tier-row:hover { background: var(--tol-ice-050); }
.tier-row + .tier-row { border-top: 1px solid var(--tol-line-100); }
.tier-row .tier-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tier-row .tier-name .name { font-weight: 700; font-size: 14px; color: var(--tol-navy-900); line-height: 1.25; }
.tier-row .tier-name .where { font-size: 12px; color: var(--fg-on-light-3); line-height: 1.3; }
.tier-row .tier-bar { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tier-row .bar-track { height: 6px; background: var(--tol-line-100); border-radius: 999px; overflow: hidden; }
.tier-row .bar-fill { height: 100%; background: linear-gradient(90deg, var(--tol-blue-600), var(--tol-cyan-500)); border-radius: 999px; }
.tier-row .tier-bar .pct { font-family: var(--font-mono); font-size: 11px; color: var(--fg-on-light-3); }
.tier-row .tier-metric { font-family: var(--font-mono); font-size: 13px; color: var(--tol-navy-900); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tier-row .chev { text-align: right; color: var(--fg-on-light-3); font-size: 18px; opacity: 0.4; transition: opacity 120ms, color 120ms, transform 120ms; }
.tier-row:hover .chev { opacity: 1; color: var(--tol-blue-600); transform: translateX(2px); }

/* ── Ops ────────────────────────────────────────────────────── */
.ops-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--tol-line-100); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.ops-summary > div { background: #fff; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: background 120ms; }
.ops-summary > div:hover { background: var(--tol-ice-050); }
.ops-summary .lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-on-light-3); }
.ops-summary .val { font-family: var(--font-brand); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; color: var(--tol-navy-900); }
.ops-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.ops-item { padding: 12px; border: 1px solid var(--tol-line-100); border-radius: 10px; cursor: pointer; transition: border-color 120ms, background 120ms; }
.ops-item:hover { border-color: rgba(0,200,255,0.40); background: var(--tol-ice-050); }
.ops-item .ops-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.ops-item .ops-name { font-weight: 600; font-size: 13px; color: var(--tol-navy-900); display: flex; align-items: center; gap: 8px; }
.ops-item .ops-id { font-family: var(--font-mono); font-size: 11px; color: var(--fg-on-light-3); }
.ops-item .ops-asset { font-size: 12px; color: var(--fg-on-light-3); font-weight: 500; }
.ops-item .ops-eta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-on-light-3); }
.ops-item .ops-bar { height: 4px; background: var(--tol-line-100); border-radius: 999px; overflow: hidden; }
.ops-item .ops-bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--tol-cyan-500), var(--tol-blue-500)); border-radius: 999px; }

/* ── State pills ────────────────────────────────────────────── */
.state-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.10em; }
.state-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.state-pill.running { background: rgba(0,214,143,0.12); color: #06754F; }
.state-pill.running .dot { background: #00D68F; box-shadow: 0 0 0 2px rgba(0,214,143,0.30); animation: pulse 1.6s infinite; }
.state-pill.queued { background: var(--tol-line-100); color: var(--fg-on-light-2); }
.state-pill.queued .dot { background: var(--fg-on-light-3); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px rgba(0,214,143,0.30); } 50% { box-shadow: 0 0 0 5px rgba(0,214,143,0.05); } }

/* ── Cyber ──────────────────────────────────────────────────── */
.cyber-stat-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.cyber-big { display: flex; flex-direction: column; gap: 6px; }
.cyber-big .v { font-family: var(--font-brand); font-weight: 800; font-size: 64px; letter-spacing: -0.035em; line-height: 1; color: var(--tol-navy-900); }
.cyber-big .l { font-size: 12px; color: var(--fg-on-light-3); font-weight: 500; }
.cyber-side { display: flex; flex-direction: column; gap: 4px; }
.cyber-side .v { font-family: var(--font-brand); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; color: var(--tol-navy-900); }
.cyber-side .l { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-on-light-3); }
.spark-row { display: flex; align-items: flex-end; gap: 3px; height: 56px; margin-bottom: 12px; }
.spark-row .bar { flex: 1; background: linear-gradient(180deg, var(--tol-cyan-500), var(--tol-blue-600)); border-radius: 2px; min-height: 4px; cursor: pointer; opacity: 0.85; transition: opacity 120ms, transform 120ms; position: relative; }
.spark-row .bar:hover { opacity: 1; transform: scaleY(1.05); transform-origin: bottom; }
.spark-row .bar .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--tol-navy-900); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-family: var(--font-mono); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms; }
.spark-row .bar:hover .tip { opacity: 1; }
.spark-axis { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--fg-on-light-3); margin-bottom: 16px; }
.vector-list { display: flex; flex-direction: column; gap: 6px; }
.vector-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--tol-line-100); cursor: pointer; }
.vector-row:first-child { border-top: none; }
.vector-row:hover .vector-name { color: var(--tol-blue-600); }
.vector-row .vector-name { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--tol-navy-900); }
.sev-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.sev-dot.high   { background: var(--tol-coral); box-shadow: 0 0 0 2px rgba(255,74,110,0.18); }
.sev-dot.medium { background: var(--tol-sun);   box-shadow: 0 0 0 2px rgba(255,200,61,0.18); }
.sev-dot.low    { background: var(--tol-cyan-500); box-shadow: 0 0 0 2px rgba(0,200,255,0.18); }

/* ── SLA ────────────────────────────────────────────────────── */
.sla-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.sla-pill { padding: 12px 14px; border-radius: 10px; background: var(--tol-ice-050); border: 1px solid var(--tol-line-100); display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: border-color 120ms; }
.sla-pill:hover { border-color: var(--tol-cyan-500); }
.sla-pill .v { font-family: var(--font-brand); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: var(--tol-navy-900); }
.sla-pill .l { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.10em; color: var(--fg-on-light-3); }
.sla-pill.breach   { background: rgba(255,74,110,0.08);  border-color: rgba(255,74,110,0.20); }
.sla-pill.breach .v { color: #B7314B; }
.sla-pill.degraded { background: rgba(255,200,61,0.10);  border-color: rgba(255,200,61,0.25); }
.sla-pill.warning  { background: rgba(0,200,255,0.08);   border-color: rgba(0,200,255,0.25); }
.sla-table-head { display: grid; grid-template-columns: 12px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 20px; gap: 14px; padding: 0 6px 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-on-light-3); }
.sla-list { display: flex; flex-direction: column; }
.sla-row { display: grid; grid-template-columns: 12px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 20px; gap: 14px; align-items: center; padding: 12px 6px; border-top: 1px solid var(--tol-line-100); cursor: pointer; transition: background 120ms; }
.sla-row:first-of-type { border-top: 1px solid var(--tol-line-200); }
.sla-row:hover { background: var(--tol-ice-050); }
.sla-row .name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sla-row .name .n { font-weight: 600; font-size: 13px; color: var(--tol-navy-900); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sla-row .name .id { font-family: var(--font-mono); font-size: 10px; color: var(--fg-on-light-3); }
.sla-row .asset { font-size: 12px; color: var(--fg-on-light-2); font-weight: 500; }
.sla-row .t, .sla-row .a { font-family: var(--font-mono); font-size: 11px; color: var(--fg-on-light-2); }
.sla-row .a { color: var(--tol-navy-900); font-weight: 500; }
.sla-row .chev { color: var(--fg-on-light-3); opacity: 0.5; }
.sla-row:hover .chev { color: var(--tol-blue-600); opacity: 1; }

/* ── Footer ─────────────────────────────────────────────────── */
.page-foot { padding: 20px 48px 48px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-on-light-3); }
.page-foot .legal { display: flex; gap: 18px; }

/* ── Drawer ─────────────────────────────────────────────────── */
.drawer-scrim { position: fixed; inset: 0; background: rgba(7,4,82,0.46); backdrop-filter: blur(4px); z-index: 80; opacity: 0; pointer-events: none; transition: opacity 220ms; }
.drawer-scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 92vw; background: #fff; z-index: 90; transform: translateX(100%); transition: transform 320ms cubic-bezier(0.2,0.8,0.2,1.0); display: flex; flex-direction: column; box-shadow: -24px 0 60px rgba(7,4,82,0.18); }
.drawer.open { transform: translateX(0); }
.drawer-head { padding: 24px 28px 18px; border-bottom: 1px solid var(--tol-line-200); display: flex; flex-direction: column; gap: 8px; }
.drawer-head .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.drawer-head .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--tol-cyan-500); }
.drawer-head h2 { margin: 0; font-family: var(--font-brand); font-size: 28px; font-weight: 800; letter-spacing: -0.025em; color: var(--tol-navy-900); }

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Primitives ────────────────────────────────────────────────
function Num({ value, onClick, title }) {
  return (
    <span className="num" role="button" tabIndex={0} title={title||"Open details"}
      onClick={(e)=>{ e.stopPropagation(); onClick&&onClick(); }}
      onKeyDown={(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onClick&&onClick(); } }}>
      {value}
    </span>
  );
}

function SparkSVG({ points, w=64, h=14, stroke="#00C8FF" }) {
  const max=Math.max(...points), min=Math.min(...points), range=max-min||1, step=w/(points.length-1);
  const d=points.map((p,i)=>`${i===0?"M":"L"} ${(i*step).toFixed(2)} ${(h-((p-min)/range)*h).toFixed(2)}`).join(" ");
  return (
    <svg className="sparkline" viewBox={`0 0 ${w} ${h}`} width={w} height={h} fill="none">
      <path d={d} stroke={stroke} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function StatePill({ state }) {
  return (
    <span className={`state-pill ${state}`}>
      <span className="dot"/>{state}
    </span>
  );
}

// ── TopBar ────────────────────────────────────────────────────

// ── KpiStrip ──────────────────────────────────────────────────
function KpiStrip({ openDrawer }) {
  const k = window.appData.kpis;
  const items = [
    { key:"compute", eyebrow:"Compute processes", value:window.fmt.int(k.computeProcesses.value), unit:null, sub:k.computeProcesses.sub, delta:k.computeProcesses.delta, deltaDir:k.computeProcesses.deltaDir, spark:[42,48,51,47,55,58,62,60,64,68,71,74] },

  ];
  return (
    <div className="kpi-strip">
      {items.map(it=>(
        <div key={it.key} className="kpi" onClick={()=>openDrawer(it.key)}>
          <div className="kpi-eyebrow">
            <span># {it.eyebrow}</span>

  const c = window.appData.cyber;
  let title = "# Threats prevented", value = c.prevented;
  if (sub==="critical") { title="# Critical threats"; value=c.critical; }
  if (sub==="isolated") { title="# Slices auto-isolated"; value=c.isolated; }
  if (sub.startsWith("vector:")) { const name=sub.slice(7); const v=c.vectors.find(x=>x.name===name); title="# "+name; value=v?v.count:"—"; }
  if (sub.startsWith("hour:")) { const hr=parseInt(sub.slice(5),10); title="# Events · "+String(hr).padStart(2,"0")+":00"; value=c.hourly[hr]; }
  return (
    <>
      <DrawerHead eyebrow="Security · AI Slice firewall" title={title+" · "+value} sub="All blocks happened before traffic reached customer infrastructure." onClose={onClose}/>
      <div className="drawer-body">
        <div className="drawer-section">
          <h4>Top vectors today</h4>
          <div className="bd-legend">
            {c.vectors.map(v=>(
              <div key={v.name} className="lg"><span className="sw" style={{background:v.severity==="high"?"#FF4A6E":v.severity==="medium"?"#FFC83D":"#00C8FF"}}/><span className="n">{v.name}</span><span className="c"></span><span className="p">{v.count}</span></div>
            ))}
          </div>
        </div>
        <div className="drawer-section">
          <h4>Most recent · 4 of {c.prevented}</h4>
          <div className="timeline">
            {c.recent.map((r,i)=>(
              <div key={i} className="tl-row">
                <span className="time">{r.time}</span>
                <div className="body"><strong>{r.vector}</strong><div className="meta">{r.asset} · {r.action}</div></div>
                <span className={`sev-dot ${r.severity==="high"?"high":r.severity==="medium"?"medium":"low"}`}/>
              </div>
            ))}
          </div>
        </div>
        <div className="callout">AI Slice slices are <strong>cryptographically isolated</strong> per workload — a compromise on one slice cannot lateral-move into others.</div>
      </div>
    </>
  );
}

function DrawerContent({ drawerKey, onClose }) {
  const [base,...rest] = drawerKey.split(":");
  const sub = rest.join(":");
  if (base==="compute")    return <ComputeDrawer onClose={onClose}/>;
  if (base==="cost")       return <CostDrawer onClose={onClose}/>;
  if (base==="emissions")  return <EmissionsDrawer onClose={onClose}/>;
  if (base==="sla")        return <SlaDrawer onClose={onClose} sub={sub}/>;
  if (base==="slaitem")    return <SlaItemDrawer onClose={onClose} id={sub}/>;
  if (base==="tier")       return <TierDrawer onClose={onClose} id={sub}/>;
  if (base==="autonomous") return <AutonomousDrawer onClose={onClose} sub={sub}/>;
  if (base==="op")         return <OpDrawer onClose={onClose} id={sub}/>;
  if (base==="cyber")      return <CyberDrawer onClose={onClose} sub={sub}/>;
  return <DrawerHead eyebrow="Detail" title="Not implemented" sub={drawerKey} onClose={onClose}/>;
}

function Drawer({ drawerKey, onClose }) {
  const open = drawerKey !== null;
  useEffect(()=>{
    const onKey = (e) => { if (e.key==="Escape"&&open) onClose(); };
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  }, [open, onClose]);
  return (
    <>
      <div className={`drawer-scrim ${open?"open":""}`} onClick={onClose}/>
      <aside className={`drawer ${open?"open":""}`} role="dialog" aria-hidden={!open}>
        {open&&<DrawerContent drawerKey={drawerKey} onClose={onClose}/>}
      </aside>
    </>
  );
}

// ── Tweaks panel ──────────────────────────────────────────────
function TweaksPanel({ shell, onShell, kpiAccent, onAccent, showSpark, onSpark, denseTier, onDense }) {
  const [open, setOpen] = useState(false);
  const ACCENTS = [
    { key:"cyan",  hex:"#00C8FF" },
    { key:"ice",   hex:"#ADFFFE" },
    { key:"coral", hex:"#FF4A6E" },
    { key:"sun",   hex:"#FFC83D" },
  ];
  return (
    <>
      <button onClick={()=>setOpen(v=>!v)} style={{position:"fixed",right:16,bottom:16,zIndex:199,border:"1px solid rgba(255,255,255,0.18)",background:"rgba(7,4,82,0.82)",color:"#fff",borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:600,cursor:"pointer",backdropFilter:"blur(8px)",display:open?"none":"flex",alignItems:"center",gap:8}}>
        ⚙ Tweaks
      </button>
      {open&&(
        <div className="twk-panel">
          <div className="twk-hd">
            <b>Tweaks</b>
            <button className="twk-x" onClick={()=>setOpen(false)}>✕</button>
          </div>
          <div className="twk-body">
            <div className="twk-sect">Shell</div>
            <div className="twk-row">
              <div className="twk-lbl"><span>Theme</span></div>
              <div className="twk-seg">
                <div className="twk-seg-thumb" style={{left: shell==="light"?"2px":"calc(50% + 1px)", width:"calc(50% - 3px)"}}/>
                {["light","dark"].map(v=><button key={v} onClick={()=>onShell(v)}>{v}</button>)}
              </div>
            </div>
            <div className="twk-sect">Visuals</div>
            <div className="twk-row">
              <div className="twk-lbl"><span>Accent</span></div>
              <div className="twk-chips">
                {ACCENTS.map(a=>(
                  <button key={a.key} className="twk-chip" data-on={kpiAccent===a.key?"1":"0"} style={{background:a.hex}} onClick={()=>onAccent(a.key)}/>
                ))}
              </div>
            </div>
            <div className="twk-row twk-row-h">
              <div className="twk-lbl"><span>KPI sparklines</span></div>
              <button className="twk-toggle" data-on={showSpark?"1":"0"} onClick={()=>onSpark(!showSpark)}><i/></button>
            </div>
            <div className="twk-row twk-row-h">
              <div className="twk-lbl"><span>Dense tier table</span></div>
              <button className="twk-toggle" data-on={denseTier?"1":"0"} onClick={()=>onDense(!denseTier)}><i/></button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ── App ───────────────────────────────────────────────────────
function App() {
  const [drawerKey, setDrawerKey] = useState(null);
  const [period, setPeriod] = useState("Today");
  const [shell, setShell] = useState("light");
  const [kpiAccent, setKpiAccent] = useState("cyan");
  const [showSpark, setShowSpark] = useState(true);
  const [denseTier, setDenseTier] = useState(false);

  const ACCENTS = { cyan:"#00C8FF", ice:"#ADFFFE", coral:"#FF4A6E", sun:"#FFC83D" };

  useEffect(()=>{
    document.body.classList.toggle("dark-shell", shell==="dark");
  }, [shell]);

  useEffect(()=>{
    document.documentElement.style.setProperty("--accent-live", ACCENTS[kpiAccent]||"#00C8FF");
  }, [kpiAccent]);

  useEffect(()=>{
    document.querySelectorAll(".kpi .sparkline").forEach(el=>{ el.style.display=showSpark?"":"none"; });
  }, [showSpark]);

  useEffect(()=>{
    document.querySelectorAll(".tier-row").forEach(el=>{ el.style.padding=denseTier?"9px 12px":""; });
  }, [denseTier]);

  return (
    <div className="app">
      <TopBar/>
      <PageHead period={period} setPeriod={setPeriod}/>
      <div className="page-body">
        <KpiStrip openDrawer={setDrawerKey}/>
        <div className="grid-12">
          <div style={{gridColumn:"span 8",display:"flex"}}>
            <ComputeBreakdown openDrawer={setDrawerKey}/>
          </div>
          <div style={{gridColumn:"span 4",display:"flex"}}>
            <AutonomousOps openDrawer={setDrawerKey}/>
          </div>
        </div>
        <div className="grid-12">
          <div style={{gridColumn:"span 6",display:"flex"}}>
            <CyberCard openDrawer={setDrawerKey}/>
          </div>
          <div style={{gridColumn:"span 6",display:"flex"}}>
            <SlaCard openDrawer={setDrawerKey}/>
          </div>
        </div>
      </div>
      <div className="page-foot">
        <span>Telenor's <span style={{color:"var(--tol-cyan-500)"}}>[AI]</span> Slice · Daily report engine v4.18 · last sync {window.appData.syncedAt}</span>
        <div className="legal">
          <span>Sovereignty: Norway / EEA</span><span>·</span>
          <span>SOC 2 Type II</span><span>·</span>
          <span>ISO 27001</span>
        </div>
      </div>
      <Drawer drawerKey={drawerKey} onClose={()=>setDrawerKey(null)}/>
      <TweaksPanel shell={shell} onShell={setShell} kpiAccent={kpiAccent} onAccent={setKpiAccent} showSpark={showSpark} onSpark={setShowSpark} denseTier={denseTier} onDense={setDenseTier}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
